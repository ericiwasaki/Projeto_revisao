<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mini Projeto</title>

	<link rel="stylesheet" href="./style.css">
	
</head>
<body>
	<div class="titulo">
		<div class="titulo-container">
			<h1>Revisão de html,css,javascript</h1>

				<p>CSS</p>
				<p>Javascript</p>
			</div>
		</div>
	</div>

	<div class="log">
		<div class="login-container">
			<h2 id="login">Login</h2>
				<div class="login-item">
					<form>
						<div class="campo">
							<label for="email" id="email">Email:</label>
							<input type="email" 	placeholder="Digite seu E-mail" id="email" required>
						</div>

						<div class="campo">
							<label for="password">Senha:</label>
							<input type="password" , 	placeholder="Digitar sua senha" id="password" required>
						</div>
					</form>
				</div>


				<div class="enviar">
					<input type="submit" value="Enviar" id="button">
				</div>
				
				<div class="cadastro">
					<a href="./cadastro.html">Não tem cadastro? Clique aqui para cadastrar</a>
				</div>
		</div>
	</div>

	<script src="./main.js"></script>
</body>
</html>
